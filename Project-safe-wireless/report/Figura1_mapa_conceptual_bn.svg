<line x1="700" y1="905" x2="700" y2="935" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="450" y="945" width="500" height="105" fill="#fff" stroke="#000" stroke-width="3"/>
<text x="700.0" y="988.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#000">Compare results</text>
<text x="700.0" y="1026.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#000">Noise fit | mean error | RMSE | coverage</text>
<rect x="180" y="1075" width="1040" height="40" fill="#fff" stroke="#000" stroke-width="3"/>
<text x="700.0" y="1100.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#000">Synthetic target only; no rubble/material model or real-person detection.</text>
